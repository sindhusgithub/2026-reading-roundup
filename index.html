<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#000}body{font-family:Arial,sans-serif;overflow-x:hidden}.masthead{height:132px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 42px;border-bottom:1px solid #ddd}.year{font:20px Newsreader,Georgia,serif;color:#000;text-decoration:none}.masthead h1{font:400 31px/1 Newsreader,Georgia,serif;margin:0}.count{justify-self:end;font-size:12px;letter-spacing:.08em}.shelf{height:calc(100vh - 132px);min-height:540px;overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-width:none;cursor:grab}.shelf::-webkit-scrollbar{display:none}.track{height:100%;position:relative;padding-block:30px}.book{position:absolute;border:0;padding:0;background:none;cursor:pointer;transform-origin:center;transition:filter .25s ease}.book:hover{filter:drop-shadow(0 14px 12px rgba(0,0,0,.15));z-index:3}.book img{display:block;height:min(250px,32vh);width:auto;aspect-ratio:2/3;object-fit:cover;box-shadow:0 2px 7px rgba(0,0,0,.18)}.hint{position:fixed;bottom:24px;right:40px;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.hint span{font-size:17px;margin-left:8px}dialog{width:min(1040px,90vw);height:min(620px,82vh);border:0;padding:0;background:#111;color:#fff;box-shadow:0 24px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.76)}.close{position:absolute;right:20px;top:15px;color:#fff;background:none;border:0;font-size:32px;cursor:pointer}.modal{height:100%;display:grid;grid-template-columns:38% 62%}.cover-wrap{display:flex;align-items:center;justify-content:center;padding:55px 30px}.cover-wrap img{max-width:100%;max-height:100%;box-shadow:0 10px 30px rgba(0,0,0,.35)}.details{padding:100px 70px 60px 35px}.meta,.author,.rating{font-family:Arial,sans-serif}.meta{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:rgba(255,255,255,.68);margin:0 0 17px}.details h2{font:400 clamp(31px,4vw,52px)/.98 Newsreader,Georgia,serif;margin:0 0 14px}.author{font-size:14px;color:rgba(255,255,255,.72);margin:0 0 32px}.rating{font-size:15px;letter-spacing:.08em}@media(max-width:700px){.masthead{height:110px;padding:0 20px;grid-template-columns:1fr auto}.masthead h1{font-size:25px}.year{display:none}.shelf{height:calc(100vh - 110px)}.track{min-width:2200px}.book img{height:210px;width:145px}.hint{right:20px;bottom:16px}dialog{width:94vw;height:86vh}.modal{grid-template-columns:1fr;grid-template-rows:55% 45%}.cover-wrap{padding:45px 30px 15px}.details{padding:20px 30px 35px}}
</style>
</head><body>
<header class="masthead"><a href="#" class="year">2026</a><h1>Books I read this year</h1><div class="count"><span id="current">01</span> / <span id="total">10</span></div></header>
<main><section class="shelf" id="shelf" aria-label="Books read in 2026"><div class="track" id="track"></div></section></main>
<div class="hint">Scroll sideways <span>→</span></div>
<dialog id="bookDialog"><button class="close" aria-label="Close">×</button><div class="modal"><div class="cover-wrap"><img id="modalCover" alt=""></div><div class="details"><p class="meta" id="modalDate"></p><h2 id="modalTitle"></h2><p class="author" id="modalAuthor"></p><p class="rating" id="modalRating"></p></div></div></dialog>
<script>

const shelf=document.getElementById('shelf'),track=document.getElementById('track'),dlg=document.getElementById('bookDialog');

const ys=[27,70,32,67,25,72,35,64],rots=[-2,1.5,.5,-1,2,-.7,1.2,-1.6];
track.style.minWidth=(BOOKS.length*245+240)+'px';
function coverURL(b){const q=encodeURIComponent(b[0]+' '+b[1]);return 'https://covers.openlibrary.org/b/title/'+encodeURIComponent(b[0])+'-L.jpg'}
BOOKS.forEach((b,i)=>{const x=document.createElement('button');x.className='book';x.style.left=(90+i*250)+'px';x.style.top=ys[i]+'%';x.style.transform='translateY(-50%) rotate('+rots[i]+'deg)';x.innerHTML='<img src="'+b[4]+'" alt="'+b[0]+'">';x.onclick=()=>{modalCover.src=b[4];modalTitle.textContent=b[0];modalAuthor.textContent=b[1];modalDate.textContent=b[2];modalRating.textContent='★ '+b[3];current.textContent=String(i+1).padStart(2,'0');dlg.showModal()};track.appendChild(x)});
document.querySelector('.close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};shelf.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();shelf.scrollLeft+=e.deltaY}},{passive:false});shelf.onscroll=()=>{const p=shelf.scrollLeft/(track.scrollWidth-shelf.clientWidth),n=Math.min(BOOKS.length-1,Math.max(0,Math.round(p*(BOOKS.length-1))));current.textContent=String(n+1).padStart(2,'0')};
</script></body></html>
